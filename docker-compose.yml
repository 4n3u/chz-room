version: '3.8'

services:
  chz-room:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chz-room
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-chz_room_jwt_secret_change_me_in_prod}
      - CHZZK_CLIENT_ID=${CHZZK_CLIENT_ID:-}
      - CHZZK_CLIENT_SECRET=${CHZZK_CLIENT_SECRET:-}
      - CHZZK_REDIRECT_URI=${CHZZK_REDIRECT_URI:-http://localhost:4000/api/auth/chzzk/callback}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:4000}
    volumes:
      - ./logs:/app/logs
